services:
  syncover:
    image: ghcr.io/titandrive/syncover:latest
    container_name: syncover
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/syncover:/config
    environment:
      - SYNCOVER_DEVICE_NAME=Titan
      - SYNCOVER_SYNCTHING_URL=http://syncthing:8384
      - SYNCOVER_SYNCTHING_API_KEY=${SYNCOVER_SYNCTHING_API_KEY:?Set your Syncthing API key}
      - SYNCOVER_PUSHOVER_TOKEN=${SYNCOVER_PUSHOVER_TOKEN:?Set your Pushover application token}
      - SYNCOVER_PUSHOVER_USER=${SYNCOVER_PUSHOVER_USER:?Set your Pushover user key}
      - SYNCOVER_POLL_SECONDS=60
      - SYNCOVER_ERROR_DELAY_SECONDS=120
      - SYNCOVER_NOTIFY_RECOVERY=true
      - SYNCOVER_STATE_FILE=/config/state.json
    networks:
      - ionproxy

networks:
  ionproxy:
    external: true
